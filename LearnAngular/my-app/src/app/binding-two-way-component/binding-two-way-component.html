<p>Giải phương trình bậc 2: ax² + bx + c = 0</p>
<table border="1">
    <tr>
        <td>Hệ số a:</td>
        <td><input type="number" [(ngModel)]="hsa" /></td>
    </tr>
    <tr>
        <td>Hệ số b:</td>
        <td><input type="number" [(ngModel)]="hsb" /></td>
    </tr>
    <tr>
        <td>Hệ số c:</td>
        <td><input type="number" [(ngModel)]="hsc" /></td>
    </tr>
    <tr>
        <td>Delta (Δ):</td>
        <td>{{ delta }}</td>
    </tr>
    <tr>
        <td>Kết quả:</td>
        <td [style.color]="resultColor"><strong>{{ result }}</strong></td>
    </tr>
    <tr>
        <td colspan="2">
            <button (click)="GiaiPtb2()">Giải phương trình</button>
            <button (click)="ResetPT()">PT mới</button>
        </td>
    </tr>
</table>
