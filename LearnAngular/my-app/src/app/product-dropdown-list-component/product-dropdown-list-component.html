<h2>Danh sách sản phẩm</h2>

<select [(ngModel)]="selectedId">
  <option [value]="0">-- Tất cả --</option>
  <option *ngFor="let p of products" [value]="p.id">{{ p.id }} - {{ p.name }} - {{ p.price }}</option>
</select>

<table border="1">
  <tr>
    <th>ID</th>
    <th>Tên sản phẩm</th>
    <th>Giá</th>
    <th>Hình ảnh</th>
  </tr>
  <tr *ngFor="let p of filteredProducts">
    <td>{{ p.id }}</td>
    <td>{{ p.name }}</td>
    <td [class.price-invalid]="p.price < 0" [class.price-valid]="p.price >= 0">{{ p.price }}</td>
    <td><img [src]="p.image" alt="{{ p.name }}" width="100"></td>
  </tr>
</table>
